name: reFlutter
on: [push]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install
        run: pip3 install reflutter
      - name: Patch
        run: echo "192.168.1.25:8080" | reflutter Medrastak_7.0.0_apks.apk
      - name: Sign
        run: |
          sudo apt-get install -y apksigner zipalign
          zipalign -p -f 4 release.RE.apk aligned.apk
          keytool -genkey -v -keystore key.jks -alias alias -keyalg RSA -keysize 2048 -validity 10000 -storepass pass123 -keypass pass123 -dname "CN=Test"
          apksigner sign --ks key.jks --ks-pass pass:pass123 --key-pass pass:pass123 --out signed.apk aligned.apk
      - uses: actions/upload-artifact@v3
        with:
          name: patched-apk
          path: signed.apk
